name: peerdrop
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: peerdrop-backend
    volumes:
      - ./server:/app
      - backend-venv:/app/.venv
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://peerdrop.sshogunn.org,http://localhost:5173,http://localhost:20015}
      MAX_ROOMS: ${MAX_ROOMS:-500}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-30}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      ROOM_TTL_SECONDS: ${ROOM_TTL_SECONDS:-600}
      ROOM_CLEANUP_INTERVAL: ${ROOM_CLEANUP_INTERVAL:-60}
      CF_TURN_KEY_ID: ${CF_TURN_KEY_ID:-}
      CF_TURN_API_TOKEN: ${CF_TURN_API_TOKEN:-}
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: peerdrop-frontend
    volumes:
      - ./client:/app
      - frontend-node-modules:/app/node_modules
    expose:
      - "5173"
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: peerdrop-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend

volumes:
  backend-venv:
  frontend-node-modules:
