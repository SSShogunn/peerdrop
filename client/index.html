<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>PeerDrop</title>
    <meta name="description" content="Send files directly between browsers over a peer-to-peer connection. No uploads, no accounts." />
    <meta property="og:title" content="PeerDrop" />
    <meta property="og:description" content="Send files directly between browsers over a peer-to-peer connection. No uploads, no accounts." />
    <meta property="og:type" content="website" />
    <script src="/config.js"></script>
    <script>
      (function () {
        var stored = localStorage.getItem("peerdrop-theme");
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
