name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev curl wget file

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('client/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - run: pnpm install --frozen-lockfile
        working-directory: client

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SIGNALING_SERVER: ${{ secrets.VITE_SIGNALING_SERVER }}
          VITE_ICE_SERVERS: ${{ secrets.VITE_ICE_SERVERS }}
          VITE_CHUNK_SIZE: ${{ secrets.VITE_CHUNK_SIZE }}
        with:
          projectPath: client
          tagName: desktop-v__VERSION__
          releaseName: "PeerDrop Desktop v__VERSION__"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
