name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            asset: PeerDrop-linux-amd64
          - platform: windows-latest
            asset: PeerDrop-windows-amd64.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version and compute tag
        id: version
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < native/desktop/VERSION)
          echo "tag=desktop-v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('client/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: native/desktop/go.sum

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        working-directory: native/desktop
        env:
          VITE_SIGNALING_SERVER: ${{ secrets.VITE_SIGNALING_SERVER }}
          VITE_ICE_SERVERS: ${{ secrets.VITE_ICE_SERVERS }}
          VITE_CHUNK_SIZE: ${{ secrets.VITE_CHUNK_SIZE }}
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL }}
        run: wails build

      - name: Rename binary (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: mv native/desktop/build/bin/PeerDrop native/desktop/build/bin/${{ matrix.asset }}

      - name: Rename binary (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: mv native/desktop/build/bin/PeerDrop.exe native/desktop/build/bin/${{ matrix.asset }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "PeerDrop Desktop ${{ steps.version.outputs.tag }}"
          body: |
            Windows may show a SmartScreen warning ("Windows protected your PC") since this
            build isn't code-signed. Click **More info → Run anyway** to launch it.
          draft: false
          prerelease: false
          files: native/desktop/build/bin/${{ matrix.asset }}
