services:
  backend:
    ports:
      - "8000:8000"
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}

  frontend:
    build: !reset null
    image: node:22-alpine
    working_dir: /app
    restart: "no"
    command: sh -c "npm install -g pnpm && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - frontend_node_modules:/app/node_modules

  cloudflared:
    profiles: ["prod"]

volumes:
  frontend_node_modules:
