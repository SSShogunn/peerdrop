name: peerdrop-dev

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: peerdrop-dev-backend
    environment:
      ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"

  frontend:
    image: node:22-alpine
    container_name: peerdrop-dev-frontend
    working_dir: /app
    command: sh -c "npm install -g pnpm && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
      VITE_DEV_BACKEND: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
